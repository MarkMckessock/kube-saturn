---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: alertmanager-secret
    template:
      data:
        # ALERTMANAGER_HEARTBEAT_URL is deliberately absent. The field does not
        # exist in 1Password and the heartbeat receiver that would use it is
        # commented out in alertmanagerconfig.yaml -- but templating it failed the
        # whole render, so the two credentials that DO exist never reached the
        # cluster. This secret errored on every refresh since the cluster was built
        # (14,892 failures over 72 days), which is why Pushover alerting never
        # fired. Restore this line only alongside the field and the receiver.
        ALERTMANAGER_PUSHOVER_TOKEN: "{{ .ALERTMANAGER_PUSHOVER_TOKEN }}"
        PUSHOVER_USER_KEY: "{{ .PUSHOVER_USER_KEY }}"
  dataFrom:
    - extract:
        key: pushover
    - extract:
        key: alertmanager
