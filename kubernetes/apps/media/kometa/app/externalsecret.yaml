---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plex-meta-manager-config
  namespace: media
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: plex-meta-manager-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config.yaml: |-
          libraries:
            Movies:
              collection_files:
                - file: /collections/movies-movies.yaml
                - file: /collections/movies-charts.yaml
                - file: /collections/movies-studios.yaml
                - default: seasonal
                - default: streaming
                - default: franchise
                  template_variables:
                    collection_mode: hide
                    # TMDb collections already curated in movies.yaml
                    exclude: [
                        10, 84, 119, 151, 230, 263, 264, 295, 304, 328, 399, 420, 495, 528, 529,
                        556, 645, 656, 735, 748, 945, 1006, 1241, 1565, 1570, 1575, 1582, 1657,
                        1733, 2150, 2326, 2344, 2366, 2467, 2602, 2794, 2806, 2883, 2980, 4246,
                        5039, 5547, 8050, 8091, 8354, 8537, 8580, 8581, 8650, 8783, 8864, 8945,
                        8979, 9328, 9332, 9435, 9485, 9518, 9735, 9743, 9744, 9818, 9888, 10194,
                        10456, 10709, 10789, 11716, 14740, 14890, 17235, 17255, 19163, 23026,
                        30663, 31562, 33085, 43072, 43563, 51509, 52783, 52785, 52984, 53159,
                        55419, 55422, 55427, 57129, 57971, 59567, 63043, 64748, 70068, 71458,
                        72119, 77816, 85943, 86024, 86027, 86029, 86055, 86066, 86092, 86105,
                        86115, 86116, 86119, 86311, 86486, 86780, 87118, 87186, 87214, 87236,
                        87250, 87253, 87359, 87800, 89137, 90306, 90863, 91361, 91430, 91657,
                        91746, 91799, 92012, 93791, 94032, 94589, 96472, 96665, 96671, 96677,
                        97445, 97456, 97459, 97460, 97461, 97768, 99606, 99727, 100693, 100965,
                        100970, 102019, 102322, 105625, 105995, 106498, 106768, 107674, 111751,
                        112636, 114783, 115570, 115575, 115762, 115776, 115838, 116669, 117693,
                        120794, 121938, 123203, 123932, 124916, 124949, 125570, 125574, 126125,
                        126209, 126221, 131292, 131295, 131296, 131635, 133352, 134897, 135416,
                        135468, 135483, 136214, 137696, 137697, 139394, 140910, 141290, 150156,
                        152544, 153010, 167613, 169452, 171732, 173710, 176097, 177467, 178117,
                        179892, 179919, 180546, 182813, 185103, 190435, 210303, 212562, 229932,
                        247028, 256322, 256377, 257053, 261307, 261526, 266672, 269098, 270252,
                        280588, 283579, 284433, 286023, 290973, 294172, 295130, 298820, 302331,
                        304378, 306031, 313086, 313576, 315595, 321148, 325470, 328372, 344830,
                        351684, 352789, 363369, 370411, 371526, 373918, 374509, 374511, 374512,
                        376650, 382685, 385386, 386162, 386382, 386534, 391860, 393379, 394316,
                        400700, 401562, 402074, 404609, 404825, 410261, 422834, 422837, 423173,
                        424202, 425175, 427084, 428046, 430186, 435259, 436295, 437451, 448150,
                        449462, 453993, 464577, 468222, 468552, 469648, 473971, 477208, 477962,
                        487376, 488924, 489724, 495527, 508334, 508783, 522250, 523855, 525891,
                        526380, 527439, 530064, 531241, 531315, 531331, 535313, 535790, 537982,
                        544669, 551278, 553717, 557495, 575987, 591028, 608103, 626517,
                        627234, 666337, 708816, 709271, 726870, 730166, 747168,
                        # overlap curated Godzilla, Ip Man, Mortal Kombat, Pet Sematary, Star Wars entries
                        813157, 830781, 848690, 1539140, 1628079, 1797552
                    ]
              operations:
                delete_collections:
                  configured: false
                  managed: true
            TV Shows:
              collection_files:
                - file: /collections/tv-charts.yaml
                - default: streaming
              operations:
                delete_collections:
                  configured: false
                  managed: true

          settings:
            cache: true
            cache_expiration: 60
            asset_directory: /config/assets
            asset_folders: true
            create_asset_folders: true
            sync_mode: append
            show_unmanaged: true
            show_filtered: false
            show_missing: true
            show_missing_assets: true
            save_missing: true
            run_again_delay: 2
            missing_only_released: false
            only_filter_missing: false
            collection_minimum: 1
            delete_below_minimum: true
            delete_not_scheduled: false
            tvdb_language: eng

          plex:
            url: http://plex.media.svc:32400
            token: {{ .PLEX_TOKEN }}
            timeout: 60
            clean_bundles: false
            empty_trash: false
            optimize: false
          tmdb:
            apikey: {{ .tmdb_api_key }}
            language: en
          omdb:
            apikey: {{ .omdb_api_key }}
          tautulli:
            url: http://tautulli:8181
            apikey: {{ .TAUTULLI_API_KEY }}
          radarr:                                         # Can be individually specified per library as well
            url: http://radarr
            token: {{ .RADARR_API_KEY }}
            add: false
            root_folder_path: "/media/movies/main/<4K"
            monitor: true
            availability: announced
            quality_profile: HD-1080p
            tag:
            search: false
          sonarr:                                         # Can be individually specified per library as well
            url: http://sonarr
            token: {{ .SONARR_API_KEY }}
            add: false
            root_folder_path: "/media/tv shows/HD"
            monitor: all
            quality_profile: WEB-1080p
            language_profile: English
            series_type: standard
            season_folder: true
            tag:
            search: false
            cutoff_search: false
  dataFrom:
    - extract:
        key: plex-meta-manager
  data:
    - secretKey: PLEX_TOKEN
      remoteRef:
        key: plex-claim-token
        property: password
    - secretKey: SONARR_API_KEY
      remoteRef:
        key: sonarr
        property: SONARR_API_KEY
    - secretKey: TAUTULLI_API_KEY
      remoteRef:
        key: Tautulli API Key
        property: TAUTULLI_API_KEY
    - secretKey: RADARR_API_KEY
      remoteRef:
        key: radarr
        property: RADARR_API_KEY
