---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pelican-k8s
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: pelican-k8s-node-secret
    creationPolicy: Owner
    template:
      data:
        token_id: "{{ .node_token_id }}"
        token: "{{ .node_token }}"
  dataFrom:
    - extract:
        key: pelican
