---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pelican-panel
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: pelican-panel-secret
    creationPolicy: Owner
    template:
      data:
        APP_KEY: "{{ .app_key }}"
  dataFrom:
    - extract:
        key: pelican
