---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app pelican-panel
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 82
        runAsGroup: 82
        runAsNonRoot: true
        fsGroup: 82
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
        # Caddy binds :80 as www-data.
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: "0"
    controllers:
      main:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          terminationGracePeriodSeconds: 120
        containers:
          main:
            image:
              repository: ghcr.io/pelican/panel
              tag: v1.0.0-rc.2
            env:
              APP_NAME: Pelican
              APP_ENV: production
              APP_DEBUG: "false"
              APP_URL: https://pelican.markmckessock.com
              APP_INSTALLED: "true"
              TZ: America/Los_Angeles
              XDG_DATA_HOME: /pelican-data
              BEHIND_PROXY: "true"
              TRUSTED_PROXIES: 10.244.0.0/16
              CACHE_STORE: file
              SESSION_DRIVER: database
              QUEUE_CONNECTION: database
              DB_CONNECTION: sqlite
              DB_DATABASE: /pelican-data/database/database.sqlite
              MAIL_MAILER: log
            envFrom:
              - secretRef:
                  name: pelican-panel-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /up
                    port: &port 80
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /up
                    port: *port
                  periodSeconds: 10
                  failureThreshold: 60
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
    service:
      main:
        controller: main
        ports:
          http:
            port: *port
    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /pelican-data
