---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dawarich-postgres-backup
spec:
  schedule: "15 4 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: postgres-backup
              image: docker.io/prodrigestivill/postgres-backup-local:17
              imagePullPolicy: IfNotPresent
              command: ["/backup.sh"]
              env:
                - name: POSTGRES_HOST
                  value: dawarich-postgres-rw
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: dawarich-postgres-superuser
                      key: username
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: dawarich-postgres-superuser
                      key: password
                - name: POSTGRES_DB
                  value: dawarich
                - name: POSTGRES_EXTRA_OPTS
                  value: "-Z6 --clean --if-exists"
              volumeMounts:
                - name: nas-backups
                  mountPath: /backups
          restartPolicy: OnFailure
          volumes:
            - name: nas-backups
              nfs:
                server: granite.markmckessock.com
                path: /volume1/Backups/databases/postgresql
