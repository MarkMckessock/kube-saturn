---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app dawarich
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      main:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              repository: docker.io/freikin/dawarich
              tag: 1.22.0
            command: ["web-entrypoint.sh"]
            args: ["bin/rails", "server", "-p", "3000", "-b", "::"]
            env:
              RAILS_ENV: production
              # Starts as root so the entrypoint can chown its volumes, then drops to this user.
              PUID: "1000"
              PGID: "1000"
              APPLICATION_HOSTS: dawarich.markmckessock.com,localhost
              APPLICATION_PROTOCOL: http
              TIME_ZONE: America/Chicago
              REDIS_URL: redis://localhost:6379
              DATABASE_HOST: dawarich-postgres-rw
              DATABASE_PORT: "5432"
              DATABASE_NAME: dawarich
              DATABASE_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: dawarich-postgres-app
                    key: username
              DATABASE_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: dawarich-postgres-app
                    key: password
              RAILS_LOG_TO_STDOUT: "true"
              SELF_HOSTED: "true"
              STORE_GEODATA: "true"
              SIDEKIQ_EMBEDDED: "true"
              WEB_CONCURRENCY: "0"
              BACKGROUND_PROCESSING_CONCURRENCY: "2"
              PROMETHEUS_EXPORTER_ENABLED: "false"
            envFrom:
              - secretRef:
                  name: dawarich-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: &port 3000
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: *port
                  periodSeconds: 10
                  failureThreshold: 90
            resources:
              requests:
                cpu: 100m
                memory: 768Mi
              limits:
                memory: 4Gi
          redis:
            image:
              repository: docker.io/library/redis
              tag: 8.10-alpine
            args: ["redis-server", "--save", "300", "10", "--appendonly", "no"]
            probes:
              liveness: &redisProbes
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["redis-cli", "ping"]
                  periodSeconds: 10
              readiness: *redisProbes
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi
    service:
      main:
        controller: main
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["{{ .Release.Name }}.markmckessock.com"]
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port
    persistence:
      storage:
        existingClaim: *app
        advancedMounts:
          main:
            main:
              - path: /var/app/storage
                subPath: storage
              - path: /var/app/tmp/imports/watched
                subPath: watched
            redis:
              - path: /data
                subPath: redis
      public:
        type: emptyDir
        advancedMounts:
          main:
            main:
              - path: /var/app/public
