---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dawarich-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: dawarich-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SECRET_KEY_BASE: "{{ .SECRET_KEY_BASE }}"
  dataFrom:
    - extract:
        key: dawarich
