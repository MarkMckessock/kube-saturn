---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: database
spec:
  schedule: "0 4 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: postgres-backup
              image: docker.io/prodrigestivill/postgres-backup-local:18
              imagePullPolicy: IfNotPresent
              command:
                - "/backup.sh"
              env:
                - name: POSTGRES_HOST
                  value: postgres-ro.database
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: cloudnative-pg-secret
                      key: username
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: cloudnative-pg-secret
                      key: password
                - name: POSTGRES_DB
                  # The databases that actually exist. The previous list named 14 databases,
                  # none of which are present -- it was left over from an earlier setup
                  # (arr stack, home-assistant, firefly). pg_dump failed on the first
                  # name every night and the job never reached the rest, so NOTHING was
                  # being backed up while tandoor (87 tables) and monica (97 tables)
                  # sat unprotected. Keep this in sync when adding a database.
                  value: "tandoor,monica"
                - name: POSTGRES_EXTRA_OPTS
                  value: "-Z6 --clean --if-exists"
              volumeMounts:
                - name: nas-backups
                  mountPath: /backups
          restartPolicy: OnFailure
          volumes:
            - name: nas-backups
              nfs:
                server: granite.markmckessock.com
                path: /volume1/Backups/databases/postgresql
