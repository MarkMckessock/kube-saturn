---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tandoor-secret
  namespace: default
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: tandoor-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SECRET_KEY: "{{ .secret_key }}"
  dataFrom:
    - extract:
        key: tandoor
