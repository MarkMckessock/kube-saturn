---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app photoframe-webhook
  namespace: &namespace home-automation
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: onepassword
      namespace: external-secrets
    # Only needed for the admin /status and /refresh commands -- the frame itself never
    # learns about images over MQTT, it polls /latest.pfrm.
    - name: mosquitto
      namespace: home-automation
  interval: 1h
  path: ./kubernetes/apps/home-automation/photoframe-webhook/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: true
