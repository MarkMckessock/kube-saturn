---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: photoframe-webhook
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: photoframe-webhook-secret
    creationPolicy: Owner
    template:
      data:
        # One more field than splitflap-webhook needs, for a specific reason: that
        # service only *receives* webhooks, so the auth token alone is enough to verify
        # a signature. This one fetches the photo back from api.twilio.com afterwards,
        # and that request is HTTP basic auth as AccountSid:AuthToken. Without the SID
        # there is no image.
        TWILIO_ACCOUNT_SID: "{{ .TWILIO_ACCOUNT_SID }}"
        TWILIO_AUTH_TOKEN: "{{ .TWILIO_AUTH_TOKEN }}"
        # Must match the URL Twilio POSTs to, character for character -- the signature
        # is computed over it, so a trailing slash or the wrong scheme 403s everything.
        TWILIO_WEBHOOK_URL: "{{ .TWILIO_WEBHOOK_URL }}"
        # Pushover. The app token lives on this app's own item; the user key is shared
        # with Alertmanager, so it comes from the `pushover` item below.
        PUSHOVER_TOKEN: "{{ .PUSHOVER_TOKEN }}"
        PUSHOVER_USER: "{{ .PUSHOVER_USER_KEY }}"
        # Phone-number -> name map as JSON. Kept in 1Password because this repo
        # is public; the app tolerates it being absent or malformed.
        CONTACTS: "{{ .CONTACTS }}"
  dataFrom:
    # Both items are merged into one map before the template runs. Every key
    # referenced above must exist in one of them -- a missing field fails the whole
    # render and takes the Twilio credentials down with it, not just the new ones.
    - extract:
        key: photoframe-webhook
    - extract:
        key: pushover
