---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app photoframe-webhook
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      photoframe-webhook:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/markmckessock/photoframe
              # Pinned by digest, not just the tag. Spegel mirrors images by digest and
              # resolves tags from its peers, so a mutable `latest` gets served from a
              # neighbour's cache indefinitely -- imagePullPolicy: Always does not help,
              # because the pull succeeds, just from the wrong place. Renovate bumps this
              # automatically; see .renovate/autoMerge.json5.
              tag: latest@sha256:b7ebeac933a9e3090928143ccf63a8a54a60255e3cee75745f1f227e6a5c2bda
            env:
              STORE_DIR: /data
              PANEL_WIDTH: "1200"
              PANEL_HEIGHT: "1600"
              # Letterbox onto white rather than centre-crop: for the group photos this
              # thing will mostly show, cropping somebody out of frame is worse than a
              # white bar, and white bars vanish against the panel's own border.
              IMAGE_CROP: "false"
              # E-ink primaries are muted; without a pre-boost a dithered photo reads
              # like a washed-out newspaper print.
              IMAGE_SATURATION: "1.4"
              IMAGE_PALETTE: measured
              DELETE_TWILIO_MEDIA: "true"
              # Every photo received is kept, untouched, on the NAS. The mount is a
              # subdirectory of /volume1/Users/mmckessock/Pictures, which the photo
              # library already scans, so they turn up there without any import step.
              # Setting ARCHIVE_DIR is the single switch that turns this on.
              ARCHIVE_DIR: /archive
              ARCHIVE_DB: /db/photos.db
              MQTT_HOST: mosquitto.home-automation.svc.cluster.local
              MQTT_PORT: "1883"
              MQTT_TOPIC_ROOT: home/photoframe
              # Pushover: one switch for all notifications. Fires when the panel has
              # actually displayed a new photo, and once when the battery gets low.
              NOTIFY_ENABLED: "true"
              # 3500 mV is PF_BATT_MV_RENDER_OK in the firmware -- the point at which
              # the frame stops rendering new photos. So the alert means "it is about
              # to stop updating", which is actionable, rather than an arbitrary %.
              NOTIFY_BATTERY_LOW_MV: "3500"
              NOTIFY_BATTERY_CLEAR_MV: "3800"
            envFrom:
              - secretRef:
                  name: photoframe-webhook-secret
            probes:
              liveness:
                enabled: true
                spec:
                  httpGet: { path: /healthz, port: 5000 }
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                spec:
                  httpGet: { path: /healthz, port: 5000 }
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                # Dithering 1.9 megapixels holds the source image, an RGB copy and an
                # index array at once. A 12 MP phone photo is the sizing case.
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      data:
        existingClaim: photoframe-data
        globalMounts:
          - path: /data
      # The originals. Quoted because the path contains spaces.
      archive:
        type: nfs
        server: granite.markmckessock.com
        path: "/volume1/Users/mmckessock/Pictures/Picture Frame Uploads"
        globalMounts:
          - path: /archive
      # The index. Deliberately NOT on the NFS share above -- SQLite over NFS is a
      # known way to corrupt a database. See server/archive.py in the photoframe repo.
      archive-db:
        existingClaim: photoframe-archive-db
        globalMounts:
          - path: /db
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    service:
      # Public-facing. Only /mms is routed here; see `route` below.
      app:
        controller: *app
        ports:
          http:
            port: 5000
      # LAN-only. This is the address the frame is configured with (IMAGE_URL in
      # firmware/src/secrets.h). Deliberately a separate Service so the image endpoint
      # has no path to the internet at all: everything on *.markmckessock.com is behind
      # the Cloudflare tunnel and public by default, and the photos friends send should
      # not leave the network.
      lan:
        controller: *app
        type: LoadBalancer
        annotations:
          # Deliberately NO external-dns hostname here. photoframe.markmckessock.com
          # belongs to the public HTTPRoute on envoy-external; if this Service claims it
          # too, external-dns writes an A record to the private LB IP and the public
          # route silently stops working. The frame is configured with the raw IP.
          lbipam.cilium.io/ips: "10.0.70.133"
        ports:
          http:
            port: 80
            targetPort: 5000
    route:
      app:
        hostnames:
          - photoframe.markmckessock.com
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          # /mms ONLY. Twilio authenticates itself with a request signature, so this
          # path is safe to expose; /latest.pfrm and /latest.png are not routed here and
          # are reachable only through the LAN Service above.
          - matches:
              - path:
                  type: PathPrefix
                  value: /mms
            backendRefs:
              # NOTE: app-template suffixes each service with its key once more than one
              # is defined, so this is photoframe-webhook-app, not photoframe-webhook.
              - name: photoframe-webhook-app
                port: 5000
