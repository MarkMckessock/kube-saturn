---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kd-webhook-internal
spec:
  # LAN-only by construction: envoy-internal carries unifi-dns=true but not
  # external-dns=proxied, so this name never enters public DNS. /latest has no auth.
  hostnames: ["kd-webhook-internal.markmckessock.com"]
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    # /latest only; /sms must stay public for Twilio and /health is probed in-cluster.
    - matches:
        - path:
            type: PathPrefix
            value: /latest
      backendRefs:
        # Single service key, so app-template adds no suffix.
        - name: kd-webhook
          namespace: home-automation
          port: 5000
