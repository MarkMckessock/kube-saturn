---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kd-webhook-gatus-ep
  labels:
    gatus.io/enabled: "true"
data:
  config.yaml: |
    endpoints:
      # In-cluster: the public route serves only /sms, which answers GET with 405.
      - name: kd-webhook
        group: home-automation
        url: http://kd-webhook.home-automation.svc.cluster.local:5000/health
        interval: 1m
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: pushover
