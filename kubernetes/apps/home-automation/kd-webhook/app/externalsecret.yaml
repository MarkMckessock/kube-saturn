---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kd-webhook
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kd-webhook-secret
    creationPolicy: Owner
    template:
      data:
        # Both are needed: the token verifies the inbound signature, and the pair is
        # sent as HTTP basic auth to fetch the photo back from api.twilio.com.
        TWILIO_ACCOUNT_SID: "{{ .TWILIO_ACCOUNT_SID }}"
        TWILIO_AUTH_TOKEN: "{{ .TWILIO_AUTH_TOKEN }}"
        # No TWILIO_WEBHOOK_URL: upstream dropped it in 6846e3a0 and now derives the
        # signed URL from request.url, rewriting http -> https because cloudflared
        # terminates TLS. That depends on Envoy forwarding the public Host header --
        # if every real webhook starts coming back 403, suspect that first.
  dataFrom:
    # Create this item in the Kubernetes vault before Flux reconciles -- nothing in git
    # creates it, and a missing field fails the whole render. Kenta's Twilio account,
    # not ours; ideally a subaccount scoped to the frame's number.
    - extract:
        key: kd-webhook
