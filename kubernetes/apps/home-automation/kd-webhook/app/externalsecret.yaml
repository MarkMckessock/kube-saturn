---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kd-webhook
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kd-webhook-secret
    creationPolicy: Owner
    template:
      data:
        # Token verifies the inbound signature; the pair is basic auth for the fetch.
        TWILIO_ACCOUNT_SID: "{{ .TWILIO_ACCOUNT_SID }}"
        TWILIO_AUTH_TOKEN: "{{ .TWILIO_AUTH_TOKEN }}"
        # No TWILIO_WEBHOOK_URL: upstream now derives the signed URL from request.url,
        # so a blanket 403 means Envoy stopped forwarding the public Host header.
  dataFrom:
    # Create this item in the Kubernetes vault by hand; nothing in git creates it.
    - extract:
        key: kd-webhook
