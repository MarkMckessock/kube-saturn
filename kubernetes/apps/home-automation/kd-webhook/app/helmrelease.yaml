---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kd-webhook
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      kd-webhook:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              # Kenta's image, not ours. Pinned by digest for the same reason as
              # photoframe: Spegel mirrors by digest and resolves tags from peers, so a
              # mutable `latest` gets served from a neighbour's cache indefinitely.
              #
              # It matters more here -- upstream CI overwrites :latest on every push to
              # main, so without a digest whatever Kenta commits lands in our cluster
              # unreviewed. Renovate will raise digest bumps but will NOT auto-merge
              # them: .renovate/autoMerge.json5 covers ghcr.io/markmckessock/* only.
              # Keep it that way and read the upstream diff before merging.
              #
              # Post-dkenta12/einkframeserver#2: validates X-Twilio-Signature before
              # the handler runs, refuses when no auth token is configured, and only
              # fetches MediaUrls on twilio.com hosts -- the account SID and auth
              # token go out as basic auth on that fetch, so the allowlist is what
              # keeps them from being handed to an arbitrary host.
              repository: ghcr.io/dkenta12/einkframeserver
              tag: latest@sha256:60ad907709719cf82f1f62e169f7e4244e435c64457d233cd409421c2593bf60
            env:
              PORT: "5000"
            envFrom:
              - secretRef:
                  name: kd-webhook-secret
            probes:
              liveness:
                enabled: true
                spec:
                  httpGet: { path: /health, port: 5000 }
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                spec:
                  httpGet: { path: /health, port: 5000 }
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                # Holds the downloaded photo in memory and writes it out twice. MMS is
                # capped at 5 MB, so this is generous.
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      # The app hardcodes Path(__file__).parent / "received_images", and __file__ is
      # /app/server.py, so this mount path is not configurable.
      data:
        existingClaim: kd-webhook-data
        globalMounts:
          - path: /app/received_images
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    service:
      app:
        controller: *app
        ports:
          http:
            port: 5000
    route:
      app:
        hostnames:
          - kd-webhook.markmckessock.com
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          # /sms ONLY, matching photoframe-webhook. /latest serves the most recent
          # photo to anyone who asks, with no auth of any kind, so it must never be
          # routed here -- everything on this gateway is public by default. It is
          # served on the LAN instead; see httproute-internal.yaml. That only reaches
          # a frame on our network: if Kenta's frame sits on his own, it needs a
          # Cloudflare Access service token on a second rule here instead.
          - matches:
              - path:
                  type: PathPrefix
                  value: /sms
            backendRefs:
              # Single service key, so no suffix -- unlike photoframe-webhook-app.
              - name: kd-webhook
                port: 5000
