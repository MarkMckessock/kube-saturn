---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frigate
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: frigate-secret
    template:
      data:
        # Escaped because both values are interpolated into the camera stream URLs.
        FRIGATE_RTSP_USER: "{{ .username | urlquery }}"
        FRIGATE_RTSP_PASSWORD: "{{ .password | urlquery }}"
  dataFrom:
    - extract:
        key: Frigate RSTP
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frigate-kiosk
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: frigate-kiosk-secret
    template:
      data:
        FRIGATE_KIOSK_USER: "{{ .username }}"
        FRIGATE_KIOSK_PASSWORD: "{{ .password }}"
  dataFrom:
    - extract:
        key: Frigate Kiosk
